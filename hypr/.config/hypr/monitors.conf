# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Auto-detect any monitor that is not listed below (generic fallback).
# Keep this FIRST so the explicit rules underneath take priority.
monitor=,preferred,auto-right,auto

# Laptop screen: 2560x1600 @ 59.97Hz at scale 2 (retina).
monitor = eDP-1, 2560x1600@59.97, 0x0, 2

# External Dell U2518D: 2560x1440 @ 59.95Hz at scale 1, on the LEFT.
# Uses 'auto-left' instead of a hardcoded coordinate so Hyprland places it
# automatically. Do NOT replace this with a manual offset:
# eDP-1 has scale 2, so it occupies only 1280 LOGICAL pixels, and a manual
# position is easy to get wrong. A wrong position leaves an empty gap
# between the two screens and the cursor cannot cross it.
#   right of laptop -> auto-right   (equivalent to 1280x0)
#   left  of laptop -> auto-left
monitor = HDMI-A-2, 2560x1440@59.95, auto-left, 1

# NOTE: GDK_SCALE is intentionally NOT set here.
# It was previously forced to 2, which made every GTK app render at double
# size on the 1440p external monitor (huge text and UI).
# Hyprland now passes the per-monitor scale (2 on eDP-1, 1 on HDMI-A-2)
# to apps directly, so GDK_SCALE is no longer needed.

# If you ever need to change the external monitor, edit the HDMI-A-2 line
# above using a mode listed by: hyprctl monitors all
#
#   Example for a 5K/retina external display:
#   monitor = HDMI-A-2, 5120x2880@60, auto-left, 2
#
#   Example for a 4K display scaled down (fractional scaling):
#   monitor = HDMI-A-2, 3840x2160@60, auto-left, 1.5
#
#   To mirror instead of extend, add: mirror = , HDMI-A-2